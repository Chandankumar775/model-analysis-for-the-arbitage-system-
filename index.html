<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Bellman-Ford Arbitrage System, interactive model</title>
<meta name="description" content="Step-by-step 3D walkthrough of a Spring Boot + Java Swing triangular arbitrage detector built on Bellman-Ford.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Familjen+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#070A0F; --surface:rgba(12,17,24,.78); --surface-solid:#0C1118;
  --ink:#E9EEF4; --ink-2:#9AA8B8; --line:rgba(160,190,220,.14); --code-bg:rgba(120,170,220,.07);
  --accent:#2FD3C1; --accent-ink:#04110F; --signal:#FF4D63; --brass:#F2A541; --violet:#A07CFF; --ice:#7FB6FF;
  --scene-bg:#070A0F; --scene-table:#0B1017; --scene-model:#1A232E; --scene-focus:#3A4F63;
  --scene-edge:#5A6B7C; --scene-grid:#132433; --scene-screen:#0A1016; --scene-tube:#3E4D5C;
  --shadow:0 30px 60px -28px rgba(0,0,0,.9), 0 0 0 1px rgba(120,170,220,.04);
  --sans:'Familjen Grotesk','Helvetica Neue',Helvetica,Arial,sans-serif;
  --mono:'JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  color-scheme:dark;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
::selection{background:color-mix(in srgb,var(--accent) 35%,transparent);color:var(--ink)}
*{scrollbar-width:thin;scrollbar-color:rgba(160,190,220,.25) transparent}
[hidden]{display:none!important}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{height:100%;margin:0;overflow:hidden;background:radial-gradient(120% 80% at 50% 0%,#0F1824 0%,var(--bg) 60%);color:var(--ink);font-family:var(--sans);-webkit-font-smoothing:antialiased}
#stage{position:fixed;inset:0;touch-action:none}
#stage canvas{display:block;width:100%;height:100%;cursor:grab}
#stage canvas.dragging{cursor:grabbing}
#stage canvas.pointing{cursor:pointer}
#labels{position:fixed;inset:0;pointer-events:none;overflow:hidden}

.lbl{position:absolute;left:0;top:0;white-space:nowrap;will-change:transform;
  font:500 11.5px/1 var(--mono);color:var(--ink);background:rgba(8,12,18,.72);
  border:1px solid var(--line);border-radius:6px;padding:5px 8px;transition:border-color .25s,color .25s,opacity .25s,box-shadow .25s;
  -webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px)}
.lbl.focus{border-color:var(--accent);color:#fff;background:color-mix(in srgb,var(--accent) 22%,rgba(8,12,18,.8));box-shadow:0 6px 18px -6px color-mix(in srgb,var(--accent) 70%,transparent)}
.lbl.hover{border-color:var(--ink-2)}
.lbl.layer{font:600 14px/1 var(--sans);background:none;border:none;padding:0;color:var(--ink-2);letter-spacing:.01em;-webkit-backdrop-filter:none;backdrop-filter:none}
.lbl.coin{font:600 13px/1.15 var(--sans);text-align:center;padding:5px 8px}
.lbl.coin .d{display:block;font:500 10.5px/1.3 var(--mono);color:var(--ink-2);margin-top:2px}
.lbl.coin .d:empty{display:none}
.lbl.coin.hot{border-color:var(--signal);color:#fff;background:color-mix(in srgb,var(--signal) 30%,rgba(8,12,18,.8));box-shadow:0 6px 20px -6px var(--signal)}
.lbl.coin.hot .d{color:#FFD0D6}
.lbl.w{font:500 10.5px/1 var(--mono);padding:3px 5px;color:var(--ink-2)}
.lbl.w.neg{color:var(--signal);border-color:color-mix(in srgb,var(--signal) 45%,transparent)}

.panel{position:fixed;background:var(--surface);border:1px solid var(--line);border-radius:14px;
  box-shadow:var(--shadow);-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px)}

.brand{position:fixed;left:24px;top:calc(20px + env(safe-area-inset-top,0px));max-width:360px}
.brand strong{display:block;font-weight:700;font-size:20px;letter-spacing:-.015em}
.brand strong em{font-style:normal;color:var(--accent)}
.brand span{display:block;font-size:13.5px;color:var(--ink-2);margin-top:3px}

.story{left:20px;bottom:calc(20px + env(safe-area-inset-bottom,0px));width:404px;max-height:calc(100% - 140px);
  display:flex;flex-direction:column;padding:20px 22px 18px}
.story-top{display:flex;align-items:center;justify-content:space-between;gap:12px}
.count{font-size:12.5px;color:var(--ink-2);font-variant-numeric:tabular-nums;white-space:nowrap}
.ticks{display:flex;gap:3px;flex-wrap:wrap;justify-content:flex-end}
.tick{width:12px;height:12px;padding:0;border:0;background:none;cursor:pointer;position:relative;border-radius:3px}
.tick::after{content:"";position:absolute;left:2px;right:2px;top:5px;height:3px;border-radius:2px;background:var(--line)}
.tick.done::after{background:color-mix(in srgb,var(--accent) 45%,transparent)}
.tick.on::after{background:var(--accent);top:4px;height:5px}
.tick:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.story h2{font-size:25px;line-height:1.14;letter-spacing:-.015em;font-weight:650;margin:14px 0 8px;text-wrap:balance}
.story .scroll{overflow:auto;min-height:0;margin-right:-8px;padding-right:8px}
.story .body{font-size:15px;line-height:1.55;color:var(--ink)}
.story .body p{margin:0 0 10px}
.story .body b{font-weight:650;color:#fff}
.story .body .mono{color:var(--accent)}
code,.mono{font-family:var(--mono);font-size:.88em}
.story pre{margin:4px 0 12px;padding:12px 14px;background:var(--code-bg);border:1px solid var(--line);border-radius:9px;overflow:auto;
  font:12.5px/1.6 var(--mono);color:var(--ink);tab-size:4}
.story pre .k{color:var(--accent)} .story pre .s{color:var(--brass)} .story pre .c{color:var(--ink-2)}
.nav{display:flex;gap:8px;margin-top:12px;padding-top:14px;border-top:1px solid var(--line)}
.nav .grow{flex:1}
.btn{font:600 14px/1 var(--sans);border-radius:9px;padding:11px 16px;cursor:pointer;border:1px solid var(--line);
  background:transparent;color:var(--ink);transition:background .2s,border-color .2s,transform .1s}
.btn:hover{border-color:var(--ink-2)}
.btn:active{transform:translateY(1px)}
.btn:disabled{opacity:.4;cursor:default}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);min-width:112px}
.btn.primary:hover{filter:brightness(1.06)}
.btn.small{padding:8px 12px;font-size:13px}
.btn[aria-pressed="true"]{border-color:var(--accent);color:var(--accent)}
.btn:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.data{right:20px;top:calc(20px + env(safe-area-inset-top,0px));width:336px;max-height:calc(100% - 140px);overflow:auto;padding:16px 18px}
.data h3{margin:0 0 4px;font-size:15px;font-weight:650;letter-spacing:-.005em}
.data .sub{margin:0 0 12px;font-size:12.5px;color:var(--ink-2);line-height:1.45}
.data table{width:100%;border-collapse:collapse;font:500 12px/1.2 var(--mono);font-variant-numeric:tabular-nums}
.data th{font:600 12px/1.2 var(--sans);color:var(--ink-2);text-align:right;padding:6px 4px;border-bottom:1px solid var(--line)}
.data th:first-child,.data td:first-child{text-align:left}
.data td{text-align:right;padding:7px 4px;border-bottom:1px solid var(--line)}
.data tr:last-child td{border-bottom:0}
.data td.hi{color:var(--signal);font-weight:600}
.data td.dim{color:var(--ink-2)}
.data td.flash{background:color-mix(in srgb,var(--brass) 28%,transparent);color:#FFE2B8;border-radius:4px}
.data tr.win td{color:var(--signal)}
.data .eq{font:500 12.5px/1.75 var(--mono);margin:0 0 10px}
.data .eq .r{color:var(--signal);font-weight:600}
.data .eq .g{color:var(--accent);font-weight:600}
.data .note{font-size:12.5px;color:var(--ink-2);line-height:1.5;margin:10px 0 0}
.data .legend{display:grid;gap:8px;font-size:13px}
.data .legend i{display:inline-block;width:14px;height:14px;border-radius:4px;vertical-align:-2px;margin-right:8px}
.data .chain{display:flex;flex-wrap:wrap;align-items:center;gap:6px;font:600 13px/1 var(--sans);margin:2px 0 12px}
.data .chain span{padding:6px 8px;border:1px solid var(--signal);color:var(--signal);border-radius:6px}
.data .empty{font-size:13px;color:var(--ink-2);margin:6px 0 0}

.pop{right:20px;bottom:calc(20px + env(safe-area-inset-bottom,0px));width:320px;padding:16px 18px}
.pop .name{font:600 14px/1.2 var(--mono);color:var(--lc,var(--accent));margin:0 0 3px}
.pop .layer{font-size:12.5px;color:var(--ink-2);margin:0 0 10px}
.pop p{margin:0 0 10px;font-size:14px;line-height:1.5}
.pop ul{margin:0;padding:0;list-style:none;font:500 12px/1.7 var(--mono);color:var(--ink-2)}
.pop .x{position:absolute;right:10px;top:10px;width:30px;height:30px;border-radius:8px;border:0;background:none;color:var(--ink-2);font-size:18px;cursor:pointer}
.pop .x:hover{background:var(--code-bg)}
.pop .x:focus-visible{outline:2px solid var(--accent)}
.pop .rel-h{margin:12px 0 6px;font-size:12px;font-weight:600;color:var(--ink-2)}
.pop .rel-list{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px}
.chip{font:500 11.5px/1 var(--mono);color:var(--ink);background:transparent;border:1px solid color-mix(in srgb,var(--c) 45%,transparent);border-radius:6px;padding:6px 8px;cursor:pointer;transition:background .15s,border-color .15s}
.chip:hover{background:color-mix(in srgb,var(--c) 16%,transparent);border-color:var(--c)}
.chip:focus-visible{outline:2px solid var(--c);outline-offset:1px}
.pop .fly{width:100%}
.tip{position:fixed;left:0;top:0;z-index:5;pointer-events:none;background:var(--surface-solid);border:1px solid var(--line);border-radius:8px;padding:8px 10px;font:500 12px/1.55 var(--mono);color:var(--ink-2);box-shadow:0 12px 28px -14px rgba(0,0,0,.9);white-space:nowrap}
.tip b{font:650 13px/1.4 var(--sans);color:var(--ink)}
.tip .neg{color:var(--signal)} .tip .pos{color:var(--accent)}
.lbl.dim{opacity:.3}
.lbl.rel{border-color:var(--ink-2);color:#fff}
.data [data-edge],.data [data-node],.data [data-cycle]{cursor:crosshair}
.data tr[data-node]:hover td,.data tr[data-cycle]:hover td,.data tr[data-edge]:hover td,.data td[data-edge]:hover{background:color-mix(in srgb,var(--accent) 12%,transparent)}

.hint{position:fixed;right:22px;bottom:calc(18px + env(safe-area-inset-bottom,0px));margin:0;font-size:12.5px;color:var(--ink-2)}
.fade{animation:fade .35s ease both}
@keyframes fade{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
.fallback{position:fixed;inset:0;display:grid;place-items:center;padding:24px;text-align:center;font-size:16px;color:var(--ink-2)}

@media (max-width:820px){
  .brand,.hint{display:none}
  .story{left:10px;right:10px;width:auto;bottom:calc(10px + env(safe-area-inset-bottom,0px));max-height:50%;padding:16px 16px 14px}
  .story h2{font-size:21px;margin-top:10px}
  .story .body{font-size:14.5px}
  .data{left:10px;right:10px;width:auto;top:calc(10px + env(safe-area-inset-top,0px));max-height:30%;padding:12px 14px}
  .pop{left:10px;right:10px;width:auto;top:calc(10px + env(safe-area-inset-top,0px));bottom:auto}
  .lbl{font-size:10.5px;padding:4px 6px}
  .lbl.layer{font-size:12px}
}
@media (prefers-reduced-motion: reduce){.fade{animation:none}.btn{transition:none}}
</style>
</head>
<body>
<div id="stage" aria-label="3D model of the arbitrage system"></div>
<div id="labels" aria-hidden="true"></div>

<header class="brand">
  <strong>Bellman-Ford <em>Arbitrage</em> System</strong>
  <span>A 3D walkthrough of a Spring Boot + Java Swing forex arbitrage detector</span>
</header>

<aside class="panel data" id="data" hidden></aside>

<section class="panel story" aria-live="polite">
  <div class="story-top">
    <span class="count" id="count"></span>
    <div class="ticks" id="ticks" role="tablist" aria-label="Steps"></div>
  </div>
  <h2 id="title"></h2>
  <div class="scroll"><div class="body" id="body"></div></div>
  <div class="nav">
    <button class="btn" id="prev" type="button">Back</button>
    <button class="btn" id="auto" type="button" aria-pressed="false">Autoplay</button>
    <span class="grow"></span>
    <button class="btn primary" id="next" type="button">Next</button>
  </div>
</section>

<div class="panel pop" id="pop" hidden role="dialog" aria-label="Class details"></div>
<p class="hint">Drag to orbit · scroll to zoom · hover a block to trace its connections · double-click to fly in</p>
<div class="tip" id="tip" hidden role="tooltip"></div>
<div class="fallback" id="fallback" hidden>WebGL is not available in this browser. Try the latest Chrome, Edge or Firefox.</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/shaders/CopyShader.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/shaders/LuminosityHighPassShader.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/EffectComposer.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/RenderPass.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/ShaderPass.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/UnrealBloomPass.js"></script>
<script>
(function () {
'use strict';
var $ = function (s) { return document.querySelector(s); };
if (typeof THREE === 'undefined') { $('#fallback').hidden = false; $('#fallback').textContent = 'Three.js failed to load. Check your internet connection and reload the page.'; return; }

var reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
var CUR = ['USD', 'EUR', 'GBP', 'INR'];
var FEE = 0.0005, SPREAD = 0.001;

/* ---------- palette ---------- */
function cssVar(n) { return getComputedStyle(document.documentElement).getPropertyValue(n).trim(); }
function readPalette() {
  return { bg: cssVar('--scene-bg'), table: cssVar('--scene-table'), model: cssVar('--scene-model'), focus: cssVar('--scene-focus'),
    edge: cssVar('--scene-edge'), grid: cssVar('--scene-grid'), screen: cssVar('--scene-screen'), tube: cssVar('--scene-tube'),
    accent: cssVar('--accent'), signal: cssVar('--signal'), brass: cssVar('--brass'), ink: cssVar('--ink'), ink2: cssVar('--ink-2'), line: cssVar('--line') };
}
var P = readPalette();
function isDark() { var c = new THREE.Color(P.bg); return (c.r + c.g + c.b) / 3 < 0.35; }

/* ---------- finance + algorithm ---------- */
function tourRates() {
  var price = [1, 1 / 0.9, 1.27, 0.012], r = [];
  for (var i = 0; i < 4; i++) { r.push([]); for (var j = 0; j < 4; j++) r[i].push(i === j ? 1 : price[i] / price[j] * (1 - (i === 3 || j === 3 ? 0.004 : SPREAD))); }
  r[0][1] = 0.90; r[1][2] = 0.88; r[2][0] = 1.27; r[2][1] = (1 / 0.88) * (1 - SPREAD);
  return r;
}
function runBF(rates, fee) {
  var n = rates.length, edges = [], i, j, k, r;
  for (i = 0; i < n; i++) for (j = 0; j < n; j++) if (i !== j) edges.push({ u: i, v: j, w: -Math.log(rates[i][j] * (1 - fee)) });
  var dist = [], parent = [];
  for (i = 0; i < n; i++) { dist.push(0); parent.push(-1); }
  var events = [], distAfter = [dist.slice()], parentAfter = [parent.slice()], x = -1, lastEdge = null, rounds = 0;
  for (r = 1; r <= n; r++) {
    x = -1; rounds = r;
    for (k = 0; k < edges.length; k++) {
      var e = edges[k], nd = dist[e.u] + e.w, relaxed = nd < dist[e.v] - 1e-12;
      if (relaxed) { dist[e.v] = nd; parent[e.v] = e.u; x = e.v; if (r === n && !lastEdge) lastEdge = { u: e.u, v: e.v, k: k }; }
      events.push({ round: r, k: k, u: e.u, v: e.v, w: e.w, relaxed: relaxed, dist: dist.slice(), parent: parent.slice() });
    }
    distAfter.push(dist.slice()); parentAfter.push(parent.slice());
    if (x === -1) break;
  }
  var cycle = null, walk = [];
  if (x !== -1 && rounds === n) {
    var y = x;
    for (k = 0; k < n && y !== -1; k++) { walk.push(y); y = parent[y]; }
    if (y !== -1) {
      var back = [], cur = y, guard = 0;
      do { back.push(cur); cur = parent[cur]; guard++; } while (cur !== y && cur !== -1 && guard <= n);
      if (cur === y) {
        var fwd = back.reverse(), s = fwd.indexOf(0);
        var rot = s > 0 ? fwd.slice(s).concat(fwd.slice(0, s)) : fwd;
        cycle = rot.concat([rot[0]]);
      }
    }
  }
  return { edges: edges, events: events, distAfter: distAfter, parentAfter: parentAfter, lastEdge: lastEdge, cycle: cycle, walk: walk, n: n, rounds: rounds };
}
function cycleProduct(rates, cyc) { var p = 1; for (var i = 0; i < cyc.length - 1; i++) p *= rates[cyc[i]][cyc[i + 1]]; return p; }
function cycleProfit(rates, cyc, fee) { return (cycleProduct(rates, cyc) * Math.pow(1 - fee, cyc.length - 1) - 1) * 100; }
function triangles(rates, fee) {
  var out = [], n = rates.length;
  for (var a = 0; a < n; a++) for (var b = a + 1; b < n; b++) for (var c = b + 1; c < n; c++) {
    [[a, b, c, a], [a, c, b, a]].forEach(function (cy) {
      out.push({ cyc: cy, gross: cycleProduct(rates, cy), net: cycleProduct(rates, cy) * Math.pow(1 - fee, 3) });
    });
  }
  return out.sort(function (p, q) { return q.net - p.net; });
}
function pathText(cyc) { return cyc.map(function (i) { return CUR[i]; }).join(' → '); }
function fmtRate(v) { return v >= 10 ? v.toFixed(2) : v.toFixed(4); }
function fmtD(v) { return (v > 0 ? '+' : v < 0 ? '−' : '') + Math.abs(v).toFixed(4); }

var TOUR = { rates: tourRates() };
TOUR.bf = runBF(TOUR.rates, FEE);
TOUR.tri = triangles(TOUR.rates, FEE);
TOUR.cycle = TOUR.bf.cycle || TOUR.tri[0].cyc;
TOUR.profit = cycleProfit(TOUR.rates, TOUR.cycle, FEE);

/* ---------- renderer ---------- */
var stage = $('#stage'), renderer;
try { renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' }); }
catch (err) { $('#fallback').hidden = false; return; }
renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.25;
stage.appendChild(renderer.domElement);
var MAX_ANISO = renderer.capabilities.getMaxAnisotropy();

var scene = new THREE.Scene();
scene.background = new THREE.Color(P.bg);
scene.fog = new THREE.FogExp2(P.bg, 0.0105);
var camera = new THREE.PerspectiveCamera(38, window.innerWidth / window.innerHeight, 0.1, 400);

/* layer colours: amber rates, teal detection, violet UI, ice for main */
var LAYER_COL = { 'Rate layer': '#F2A541', 'Detection layer': '#2FD3C1', 'UI layer': '#A07CFF', 'main thread': '#7FB6FF' };

/* ---------- procedural textures ---------- */
function canvasTex(w, h, draw, rx, ry) {
  var c = document.createElement('canvas'); c.width = w; c.height = h; draw(c.getContext('2d'), w, h);
  var t = new THREE.CanvasTexture(c); t.anisotropy = MAX_ANISO;
  if (rx) { t.wrapS = t.wrapT = THREE.RepeatWrapping; t.repeat.set(rx, ry || rx); }
  return t;
}
function noise(ctx, w, h, n, a, light) {
  for (var i = 0; i < n; i++) { ctx.fillStyle = (light ? 'rgba(255,255,255,' : 'rgba(0,0,0,') + (Math.random() * a).toFixed(3) + ')'; ctx.fillRect(Math.random() * w, Math.random() * h, 1 + Math.random() * 2, 1 + Math.random() * 2); }
}
/* floor: polished dark stone with an etched trading-floor grid */
var floorTex = canvasTex(1024, 1024, function (c, w, h) {
  var g = c.createLinearGradient(0, 0, w, h); g.addColorStop(0, '#0C121A'); g.addColorStop(1, '#090D13'); c.fillStyle = g; c.fillRect(0, 0, w, h);
  noise(c, w, h, 9000, 0.05, true); noise(c, w, h, 6000, 0.35, false);
  for (var v = 0; v <= w; v += 64) {
    var major = v % 256 === 0;
    c.fillStyle = major ? 'rgba(90,170,210,.16)' : 'rgba(90,150,200,.045)';
    c.fillRect(v - (major ? 1 : 0.5), 0, major ? 2 : 1, h); c.fillRect(0, v - (major ? 1 : 0.5), w, major ? 2 : 1);
  }
  c.fillStyle = 'rgba(120,200,230,.3)';
  for (var x = 0; x <= w; x += 256) for (var y = 0; y <= h; y += 256) c.fillRect(x - 3, y - 3, 6, 6);
}, 7);

  popEl.querySelector('.x').addEventListener('click', hidePop);
  popEl.querySelector('.x').focus({ preventScroll: true });
}
function hidePop() { popEl.hidden = true; popId = null; updateDeps(); }
popEl.addEventListener('click', function (e) {
  var g = e.target.closest('[data-go]'), f = e.target.closest('[data-fly]');
  if (g) { showPop(g.dataset.go); flyTo(blockView(g.dataset.go)); }
  else if (f) flyTo(blockView(f.dataset.fly));
});
popEl.addEventListener('mouseover', function (e) { var g = e.target.closest('[data-go]'); if (g) BLOCKS[g.dataset.go].label.el.classList.add('hover'); });
popEl.addEventListener('mouseout', function (e) { var g = e.target.closest('[data-go]'); if (g) BLOCKS[g.dataset.go].label.el.classList.remove('hover'); });

/* ---------- graph tooltip ---------- */
var tipEl = $('#tip'), hoverEdge = -1;
var CUR_NAME = ['US dollar', 'Euro', 'British pound', 'Indian rupee'];
function currentRates() { return live.on && live.rates ? live.rates : TOUR.rates; }
function edgeTip(k) {
  var e = EDGES[k], r = currentRates()[e.i][e.j], w = -Math.log(r * (1 - FEE));
  return '<b>' + CUR[e.i] + ' → ' + CUR[e.j] + '</b><br>rate&nbsp;&nbsp; ' + fmtRate(r) + '<br>weight <span class="' + (w < 0 ? 'neg' : 'pos') + '">' + fmtD(w) + '</span>' +
    (e.state === 'cycle' ? '<br><span class="neg">part of the arbitrage cycle</span>' : '');
}
function coinTip(i) {

  for (var j = 0; j < 4; j++) if (j !== i) h += '<br>1 ' + CUR[i] + ' → ' + fmtRate(r[i][j]) + ' ' + CUR[j];

}
function moveTip(x, y, html) {

  tipEl.innerHTML = html; tipEl.hidden = false;
  var w = tipEl.offsetWidth, h = tipEl.offsetHeight;
  tipEl.style.left = Math.min(x + 16, window.innerWidth - w - 8) + 'px';
  tipEl.style.top = Math.min(y + 16, window.innerHeight - h - 8) + 'px';
}
function setHoverEdge(k) {
  if (k === hoverEdge) return;
  if (hoverEdge >= 0) setEdge(hoverEdge, EDGES[hoverEdge].state);
  hoverEdge = k;
  if (k >= 0) { var e = EDGES[k]; e.mat.emissive.set('#ffffff'); e.mat.emissiveIntensity = 0.45; e.cone.scale.set(1.7, 1.7, 1.7); }
}

/* ---------- pointer: orbit, zoom, pick ---------- */
var canvas = renderer.domElement, pointers = {}, dragStart = null, moved = 0, pinch = null, hoverId = null;
var ray = new THREE.Raycaster(), ndc = new THREE.Vector2();
var graphPickables = [];
COINS.forEach(function (c, i) { c.mesh.userData.coin = i; graphPickables.push(c.mesh); });
EDGES.forEach(function (e, k) { e.tube.userData.edge = k; e.cone.userData.edge = k; graphPickables.push(e.tube, e.cone); });
ray.params.Line = { threshold: 0.1 };
function pickAny(x, y) {
  ndc.set(x / window.innerWidth * 2 - 1, -(y / window.innerHeight) * 2 + 1); ray.setFromCamera(ndc, camera);
  var hb = ray.intersectObjects(blockMeshes, false)[0];
  var hg = graph.visible ? ray.intersectObjects(graphPickables, false)[0] : null;
  if (hg && (!hb || hg.distance < hb.distance)) return hg.object.userData.coin !== undefined ? { coin: hg.object.userData.coin } : { edge: hg.object.userData.edge };
  return hb ? { block: hb.object.userData.id } : {};
}
function pick(x, y) { return pickAny(x, y).block || null; }
canvas.addEventListener('pointerdown', function (e) {
  canvas.setPointerCapture(e.pointerId); pointers[e.pointerId] = { x: e.clientX, y: e.clientY };
  var ids = Object.keys(pointers);
  if (ids.length === 1) { dragStart = { x: e.clientX, y: e.clientY }; moved = 0; canvas.classList.add('dragging'); }
  if (ids.length === 2) { var a = pointers[ids[0]], b = pointers[ids[1]]; pinch = { d: Math.hypot(a.x - b.x, a.y - b.y), r: orbit.r }; }
  moveTip(0, 0, null);
});
canvas.addEventListener('pointermove', function (e) {
  var p = pointers[e.pointerId];
  if (!p) {
    var hit = pickAny(e.clientX, e.clientY), id = hit.block || null;
    if (id !== hoverId) { if (hoverId) BLOCKS[hoverId].label.el.classList.remove('hover'); hoverId = id; if (id) BLOCKS[id].label.el.classList.add('hover'); updateDeps(); }
    setHoverEdge(hit.edge !== undefined ? hit.edge : -1);
    moveTip(e.clientX, e.clientY, hit.edge !== undefined ? edgeTip(hit.edge) : hit.coin !== undefined ? coinTip(hit.coin) : null);
    canvas.classList.toggle('pointing', !!id || hit.edge !== undefined || hit.coin !== undefined);
    return;
  }
  var dx = e.clientX - p.x, dy = e.clientY - p.y; p.x = e.clientX; p.y = e.clientY;
  var ids = Object.keys(pointers);
  if (ids.length === 2 && pinch) { var a = pointers[ids[0]], b = pointers[ids[1]], d = Math.hypot(a.x - b.x, a.y - b.y); orbit.r = Math.max(6, Math.min(90, pinch.r * pinch.d / Math.max(d, 1))); camTween = null; return; }
  moved += Math.abs(dx) + Math.abs(dy);
  if (moved > 4) { camTween = null; orbit.theta -= dx * 0.0055; orbit.phi = Math.max(0.18, Math.min(1.45, orbit.phi - dy * 0.0045)); }
});
canvas.addEventListener('pointerleave', function () {

  if (hoverId) { BLOCKS[hoverId].label.el.classList.remove('hover'); hoverId = null; updateDeps(); }
});
function endPointer(e) {
  if (!pointers[e.pointerId]) return;
  var wasSingle = Object.keys(pointers).length === 1;
  delete pointers[e.pointerId]; pinch = null; canvas.classList.remove('dragging');
  if (wasSingle && moved <= 4 && e.type === 'pointerup') {
    var hit = pickAny(e.clientX, e.clientY);
    if (hit.block) showPop(hit.block);
    else if (hit.edge !== undefined) moveTip(e.clientX, e.clientY, edgeTip(hit.edge));
    else if (hit.coin !== undefined) moveTip(e.clientX, e.clientY, coinTip(hit.coin));

  }
}
canvas.addEventListener('pointerup', endPointer);
canvas.addEventListener('pointercancel', endPointer);
canvas.addEventListener('dblclick', function (e) { var id = pick(e.clientX, e.clientY); if (id) { showPop(id); flyTo(blockView(id)); } });
canvas.addEventListener('wheel', function (e) { e.preventDefault(); camTween = null; orbit.r = Math.max(6, Math.min(90, orbit.r * (1 + e.deltaY * 0.0011))); }, { passive: false });

/* ---------- data panel ↔ 3D: hovering a row lights it up in the model ---------- */
var preview = null, previewEl = null, GRAPH_C = new THREE.Vector3(0, GY, 0);
function startPreview() {
  if (preview) return;
  preview = { vis: graph.visible, states: EDGES.map(function (e) { return e.state; }),
    coins: COINS.map(function (c) { return [c.ring.visible, c.aura.visible, c.label.el.classList.contains('hot'), c.label.show, c.ringMat.color.getHex()]; }) };
  if (!graph.visible) { graph.visible = true; setGrow(1); COINS.forEach(function (c) { c.label.show = true; }); }
}
function endPreview() {
  if (!preview) return;
  var pv = preview; preview = null;
  graph.visible = pv.vis;
  COINS.forEach(function (c, i) { var s = pv.coins[i]; c.ring.visible = s[0]; c.aura.visible = s[1]; c.label.el.classList.toggle('hot', s[2]); c.label.show = s[3]; c.ringMat.color.setHex(s[4]); });
  if (live.on) showCycle(monState.cycle); else EDGES.forEach(function (e, k) { setEdge(k, pv.states[k]); });
}
function ringCoin(i, col) { COINS[i].ring.visible = true; COINS[i].ringMat.color.set(col); }
dataEl.addEventListener('mouseover', function (e) {
  var el = e.target.closest('[data-edge],[data-node],[data-cycle]');
  if (el === previewEl) return;
  endPreview(); previewEl = el; if (!el) return;
  if (!graph.visible && camera.position.distanceTo(GRAPH_C) < 12) return;
  startPreview();
  if (el.dataset.edge) { var uv = el.dataset.edge.split('-').map(Number); resetEdges(); COINS.forEach(function (c) { c.ring.visible = false; c.aura.visible = false; }); setEdge(edgeIndex(uv[0], uv[1]), 'check'); ringCoin(uv[0], P.accent); ringCoin(uv[1], P.accent); }
  else if (el.dataset.node) { COINS.forEach(function (c) { c.ring.visible = false; }); ringCoin(+el.dataset.node, P.accent); }
  else if (el.dataset.cycle) showCycle(el.dataset.cycle.split(',').map(Number));
});
dataEl.addEventListener('mouseleave', function () { endPreview(); previewEl = null; });

/* ---------- resize + theme ---------- */
function onResize() { camera.aspect = window.innerWidth / window.innerHeight; camera.updateProjectionMatrix(); renderer.setSize(window.innerWidth, window.innerHeight); if (composer) { composer.setSize(window.innerWidth, window.innerHeight); bloom.setSize(window.innerWidth, window.innerHeight); } }
window.addEventListener('resize', onResize);
function retheme() {
  P = readPalette(); setLights();
  scene.background.set(P.bg); scene.fog.color.set(P.bg);
  gridMat.color.set(P.grid); edgeMat.color.set(P.edge); 
  coinMat.color.set(P.brass);
  footMats.brass.color.set(P.brass); footMats.accent.color.set(P.accent); footMats.shared.color.set(P.ink2);
  packetMats = {}; EDGES.forEach(function (e, k) { setEdge(k, e.state); }); COINS.forEach(function (c) { c.ringMat.color.set(P.signal); });
  drawMonitor(); if (STEPS[current] && STEPS[current].data && !live.on) setData(STEPS[current].data());
}
var mq = window.matchMedia('(prefers-color-scheme: dark)');
if (mq.addEventListener) mq.addEventListener('change', retheme); else if (mq.addListener) mq.addListener(retheme);
new MutationObserver(retheme).observe(document.documentElement, { attributes: true, attributeFilter: ['data-theme'] });
if (document.fonts && document.fonts.ready) document.fonts.ready.then(drawMonitor);

/* ---------- bloom (optional: falls back to a plain render) ---------- */
var composer = null, bloom = null;
try {
  if (THREE.EffectComposer && THREE.UnrealBloomPass && THREE.RenderPass) {
    composer = new THREE.EffectComposer(renderer);
    composer.addPass(new THREE.RenderPass(scene, camera));
    bloom = new THREE.UnrealBloomPass(new THREE.Vector2(window.innerWidth, window.innerHeight), 0.32, 0.4, 0.9);
    composer.addPass(bloom);
  }
} catch (err) { composer = null; }

/* ---------- loop ---------- */
var tmpV = new THREE.Vector3(), focusCol = new THREE.Color(), baseCol = new THREE.Color(), narrow = false;
function frame(now) {
  requestAnimationFrame(frame);
  if (camTween) {
    var t = Math.min(1, (now - camTween.t0) / camTween.dur), k = ease(t), f = camTween.from, to = camTween.to;
    orbit.target.lerpVectors(f.target, to.target, k); orbit.r = f.r + (to.r - f.r) * k;
    orbit.theta = f.theta + camTween.dTheta * k; orbit.phi = f.phi + (to.phi - f.phi) * k;
    if (t >= 1) camTween = null;
  }
  applyOrbit();
  for (var i = tweens.length - 1; i >= 0; i--) { var tw = tweens[i], p = Math.min(1, (now - tw.t0) / tw.dur); tw.fn(ease(p)); if (p >= 1) { tweens.splice(i, 1); tw.done && tw.done(); } }
  for (i = PACKETS.length - 1; i >= 0; i--) {
    var pk = PACKETS[i], q = Math.min(1, (now - pk.t0) / pk.dur);
    pk.curve.getPoint(ease(q), pk.mesh.position);
    var ta = pk.trail.geometry.attributes.position, tarr = ta.array;
    tarr.copyWithin(3, 0, tarr.length - 3); tarr[0] = pk.mesh.position.x; tarr[1] = pk.mesh.position.y; tarr[2] = pk.mesh.position.z; ta.needsUpdate = true;
    if (q >= 1) { dropPacket(pk); PACKETS.splice(i, 1); pk.done(); }
  }
  for (i = 0; i < blockMeshes.length; i++) {
    var m = blockMeshes[i], id = m.userData.id, on = focusSet[id] || hoverId === id || popId === id, dimmed = activeRel && !activeRel[id];
    m.material.color.lerp(dimmed ? m.userData.dim : on || (activeRel && activeRel[id]) ? m.userData.hot : m.userData.base, 0.1);
    m.material.emissiveIntensity += ((dimmed ? 0.03 : focusSet[id] ? 0.5 + Math.sin(now / 320) * 0.12 : on ? 0.45 : activeRel ? 0.3 : 0.14) - m.material.emissiveIntensity) * 0.1;
  }
  if (!reduceMotion) { dust.rotation.y = now * 0.000012; dust.position.y = Math.sin(now / 4000) * 0.4; scanRing.rotation.z = now / 2400; beam.material.opacity = 0.018 + Math.sin(now / 700) * 0.006; }
  for (i = 0; i < EDGES.length; i++) { var eg = EDGES[i]; if (eg.spark.visible) eg.curve.getPoint(((now / (eg.state === 'cycle' ? 900 : 650)) + i * 0.13) % 1, eg.spark.position); }
  var pulse = 1 + Math.sin(now / 260) * 0.06;
  COINS.forEach(function (c, ci) {
    if (c.ring.visible) c.ring.scale.set(pulse, pulse, pulse);
    if (c.aura.visible) c.aura.material.opacity = 0.22 + Math.sin(now / 260) * 0.1;
    if (!reduceMotion && graph.visible) { c.mesh.rotation.y = now / 1400 + ci; c.mesh.position.y = COIN_POS[ci].y + Math.sin(now / 900 + ci * 1.7) * 0.07; }
  });
  if (composer) composer.render(); else renderer.render(scene, camera);
  narrow = window.innerWidth < 820;
  var W = window.innerWidth, H = window.innerHeight;
  for (i = 0; i < LABELS.length; i++) {
    var L = LABELS[i], vis = L.show;
    if (vis && L.el.classList.contains('coin') && !graph.visible) vis = false;
    if (vis && narrow && !L.el.classList.contains('layer') && !L.el.classList.contains('coin') && !L.el.classList.contains('w') && !L.el.classList.contains('focus')) vis = false;
    if (vis) { tmpV.copy(L.getPos()).project(camera); if (tmpV.z > 1 || tmpV.x < -1.2 || tmpV.x > 1.2 || tmpV.y < -1.2 || tmpV.y > 1.2) vis = false; }
    if (!vis) { if (L.shown) { L.el.style.display = 'none'; L.shown = false; } continue; }
    if (!L.shown) { L.el.style.display = ''; L.shown = true; }
    var x = (tmpV.x + 1) / 2 * W, y = (1 - tmpV.y) / 2 * H;
    L.el.style.transform = L.el.classList.contains('layer') ? 'translate3d(' + x.toFixed(1) + 'px,' + y.toFixed(1) + 'px,0)' : 'translate3d(' + x.toFixed(1) + 'px,' + y.toFixed(1) + 'px,0) translate(-50%,-100%)';
  }
}

/* ---------- start ---------- */
var startAt = 0, m = /#step-(\d+)/.exec(location.hash);
if (m) startAt = Math.max(0, Math.min(STEPS.length - 1, parseInt(m[1], 10) - 1));
var o0 = presetToOrbit({ p: [0, 46, 60], t: [0, 1.5, -1] }); orbit.target.copy(o0.target); orbit.r = o0.r; orbit.theta = o0.theta; orbit.phi = o0.phi;
drawMonitor();
go(startAt);
requestAnimationFrame(frame);
window.__tour = { go: go, steps: STEPS.length, tour: TOUR };
})();
